<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MMCP Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="topnav">
        <div class="nav-brand">MMCP</div>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Overview</a>
            <a href="/markets" class="{% if '/markets' in request.path %}active{% endif %}">Markets</a>
            <a href="/alerts" class="{% if '/alerts' in request.path %}active{% endif %}">Alerts</a>
            <a href="/system" class="{% if '/system' in request.path %}active{% endif %}">System</a>
        </div>
        <div class="nav-status" id="nav-status">
            <span class="status-dot" id="health-dot"></span>
            <span id="last-updated">--</span>
        </div>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/refresh.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
